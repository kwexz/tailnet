# Только статические проверки. Никакого развёртывания, изменения firewall/DNS,
# маршрутов, Docker-контейнеров или подключений к VPS.
name: static-checks

on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Run static checks (strict)
        run: bash scripts/check-static.sh
        env:
          STRICT: "1"
